[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-novel"
version = "0.1.0a4"
description = "Synapse Novel: a deterministic, model-free novel planning and writing flow"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
synapse-novel = "synapse.novel.edition_cli:main"

[tool.setuptools.packages.find]
include = ["synapse*"]
